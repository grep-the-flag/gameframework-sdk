name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  sdk-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
        with:
          python-version: "3.12"   # matches the core backend container; also the requires-python floor
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
        with:
          python-version: "3.12"   # matches the core backend container; also the requires-python floor
      - run: uv sync
      - run: uv run pytest
